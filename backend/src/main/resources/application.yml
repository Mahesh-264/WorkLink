server:
  port: ${PORT:8080}

spring:
  application:
    name: WorkLink

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:worklink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    # JWT_SECRET must be a Base64-encoded secret of at least 256 bits.
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

worklink:
  testing-endpoints:
    enabled: ${WORKLINK_TESTING_ENDPOINTS_ENABLED:false}

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info
