
server:
  port: ${PORT:8080}

spring:
  application:
    name: WorkLink

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:worklink}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

security:
  jwt:
    # JWT_SECRET must be a Base64-encoded secret of at least 256 bits.
    secret: ${WORKLINK_JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

worklink:
  matching:
    ranking:
      compatibility-weight: ${WORKLINK_MATCH_COMPATIBILITY_WEIGHT:0.70}
      trust-weight: ${WORKLINK_MATCH_TRUST_WEIGHT:0.30}
    context-aware:
      compatibility-weight: ${WORKLINK_CONTEXT_COMPATIBILITY_WEIGHT:0.50}
      semantic-weight: ${WORKLINK_CONTEXT_SEMANTIC_WEIGHT:0.20}
      trust-weight: ${WORKLINK_CONTEXT_TRUST_WEIGHT:0.20}
      performance-weight: ${WORKLINK_CONTEXT_PERFORMANCE_WEIGHT:0.10}

  testing-endpoints:
    enabled: ${WORKLINK_TESTING_ENDPOINTS_ENABLED:false}

  catalog-seed:
    enabled: ${WORKLINK_CATALOG_SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health, info
